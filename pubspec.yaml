name: volleyball_scouting
description: A new Flutter project for volleyball scouting and statistical analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: 11.0.0
  path_provider_foundation: 2.3.2
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: 6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.jpg"
